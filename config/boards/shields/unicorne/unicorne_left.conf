# ===== Power / sleep =====
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="uniCorne"

# ===== Split battery reporting =====
# Left (central) fetches the right half's battery over the split link
# so both halves can be shown on the OLED.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Also re-broadcast the right half's level to the host over BLE.
# Note: many hosts (esp. Windows) still only display one battery number.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Show battery as a percentage on the OLED instead of just an icon.
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# ===== OLED DISPLAY (SSD1306 128x32 over I2C) =====
CONFIG_ZMK_DISPLAY=y

# ===== RGB underglow (WS2812 over SPI) =====
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_NRFX_SPIM3=y

# Default underglow color: orange, 70% brightness
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=30
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=70
