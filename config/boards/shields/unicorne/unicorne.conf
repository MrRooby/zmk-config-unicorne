CONFIG_ZMK_SLEEP=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="uniCorne"
 
# OLED DISPLAY
CONFIG_ZMK_DISPLAY=y
